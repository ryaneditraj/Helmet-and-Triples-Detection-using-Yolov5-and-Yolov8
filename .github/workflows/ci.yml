name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Syntax-check the scripts
        run: python -m compileall -q config.py geometry.py yolo_loader.py helmets.py triples.py test.py offender.py
      - name: Run unit tests
        run: python -m pytest -q
