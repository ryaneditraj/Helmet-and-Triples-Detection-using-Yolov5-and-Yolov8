name: Feature request
description: Suggest an improvement to detection, the dashboard, or the docs.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the project do instead?
    validations:
      required: true
